name: 更新股價新高新低資料並部署

on:
  # 排程改由外部 cron-job.org 定時呼叫 GitHub API 觸發（GitHub 內建 schedule 常漏跑）。
  # 呼叫方式見 README。此處保留 workflow_dispatch 讓 API 與手動皆可觸發。
  workflow_dispatch:

# 部署 GitHub Pages 所需權限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      # 用線上目前的 data.json 當合併基準，避免 repo 裡 commit 的版本過舊、
      # 導致 Yahoo 抓取範圍(見 main.go 的 dataRange)滾動窗口外、之前已累積的舊資料被覆蓋消失。
      - name: Restore latest live data.json if available
        env:
          PAGE_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
        run: |
          echo "Trying to download live data from ${PAGE_DATA_URL}"
          curl -fsSL "${PAGE_DATA_URL}" -o web/data.json || echo "Live data not available; keeping committed web/data.json"

      # 每次清空重抓最新資料(抓取範圍由 main.go 的 dataRange 決定，目前為 1y，
      # 足夠銜接每次執行間的空檔；不使用 cache：舊檔存在會被跳過而永遠不更新)。
      # 程式內會把上面還原的舊 data.json 與這次新算的結果合併，不會整批覆蓋。
      - name: Run crawler (auto mode, fresh fetch)
        run: go run . -auto -clear

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
