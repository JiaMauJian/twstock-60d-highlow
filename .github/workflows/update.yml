name: 更新股價新高新低資料並部署

on:
  # 排程改由外部 cron-job.org 定時呼叫 GitHub API 觸發（GitHub 內建 schedule 常漏跑）。
  # 呼叫方式見 README。此處保留 workflow_dispatch 讓 API 與手動皆可觸發。
  workflow_dispatch:

# 部署 GitHub Pages 所需權限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      # 每次清空重抓，確保拿到完整 20 年且最新的資料
      # （不使用 cache：舊檔存在會被跳過而永遠不更新）
      - name: Run crawler (auto mode, fresh fetch)
        run: go run . -auto -clear

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
