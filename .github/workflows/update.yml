name: 更新股價新高新低資料並部署

on:
  # 排程改由外部 cron-job.org 定時呼叫 GitHub API 觸發（GitHub 內建 schedule 常漏跑）。
  # 呼叫方式見 README。此處保留 workflow_dispatch 讓 API 與手動皆可觸發。
  workflow_dispatch:

# 讓 workflow 能寫回 repo（快取 data/）並部署 Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      # 還原上一次跑完的 data/ 個股快取，避免每天重抓上千檔
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: stock-data-${{ github.run_id }}
          restore-keys: |
            stock-data-

      - name: Run crawler (auto mode)
        run: go run . -auto

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
